# Nginx site for Mr Cafe.
# Copy to /etc/nginx/sites-available/resto, link it into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
# Then get HTTPS with:  sudo certbot --nginx -d order.example.com
# (certbot adds the 443 block and the http -> https redirect for you)
#
# Replace order.example.com with your domain everywhere below.

upstream resto_app {
    server unix:/run/resto/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name order.example.com;

    # menu photos (up to 5 MB) and logos are uploaded from the staff screens;
    # a little more than 5M, for the rest of the form around the photo
    client_max_body_size 8M;

    # CSS, JS (python manage.py collectstatic puts them here)
    location /static/ {
        alias /srv/resto/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # uploaded menu photos and logos
    location /media/ {
        alias /srv/resto/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://resto_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # Django reads this (SECURE_PROXY_SSL_HEADER)
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
