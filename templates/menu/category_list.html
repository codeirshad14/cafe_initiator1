{% extends "base_staff.html" %}

{% block title %}Categories{% endblock %}
{% block crumbs %}<span>/</span><span>Setup</span><span>/</span><span>Categories</span>{% endblock %}
{% block page_title %}Categories{% endblock %}

{% block page_actions %}
<a class="btn btn-light" href="{% url 'menu:menu_item_list' %}"><i class="bi bi-journal-text" aria-hidden="true"></i> Menu items</a>
<button class="btn btn-primary" type="button" hx-get="{% url 'menu:category_add' %}" hx-target="#panel">
    <i class="bi bi-plus-lg" aria-hidden="true"></i> Add category
</button>
{% endblock %}

{% block content %}
<section class="panel">
    <div id="categoryRows" hx-get="{% url 'menu:category_rows' %}" hx-trigger="rowsChanged from:body" hx-include="#categoryRows [name=page]">
        {% include "menu/_category_rows.html" %}
    </div>
</section>
{% endblock %}
