{# after the guest pressed a choice (orders.guest_views.call_waiter / call_about_order): in place of the choices #}
<div class="call-sheet-done" role="status">
    <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
    {% if called %}
    <strong>{{ reason }}: sent</strong>
    <span>{{ where }}</span>
    {% else %}
    <strong>Already sent</strong>
    <span>{{ where }} You can send again in a moment.</span>
    {% endif %}
</div>
