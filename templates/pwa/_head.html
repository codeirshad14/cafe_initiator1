{% load static %}
{# the installable app (pwa/views.py): staff pages, the login page and the website. Not the guests' pages. #}
<link rel="manifest" href="{% url 'pwa:manifest' %}">
<link rel="icon" href="{% static 'img/app/favicon-32.png' %}" sizes="32x32" type="image/png">
<link rel="icon" href="{% static 'img/admin-logo.svg' %}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{% static 'img/app/apple-touch-icon.png' %}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="{{ brand_name }}">
<meta name="application-name" content="{{ brand_name }}">
